[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "home-bills-agent"
version = "0.5.0"
description = "Home bills agent for Anapa water utilities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.7",
    "anthropic>=0.25",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pillow>=10.0",
    "rich>=13.0",
    "questionary>=2.0",
    "selectolax>=0.3",
    "sqlalchemy>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
